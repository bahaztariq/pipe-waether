services:
  # Core application service
  app:
    build: .
    container_name: pipe-weather
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    command: python3 -m app.main
  db:
    image: postgres:17
    container_name: pipe-weather-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pipe-weather-pgadmin
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  streamlit:
    build: .
    container_name: pipe-weather-streamlit
    depends_on:
      - db
    env_file: .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run app/streamlit/streamlit_app.py --server.address=0.0.0.0
  airflow:
    image: apache/airflow:latest
    container_name: pipe-weather-airflow
    depends_on:
      - db
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME}:admin"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
      PYTHONPATH: /opt/airflow/project
      PROJECT_DIR: /opt/airflow/project
      BRONZE_DIR: /opt/airflow/project/bronze
      CITIES_FILE: /opt/airflow/project/bronze/cities.csv
      OPEN_METEO_URL: https://api.open-meteo.com/v1/forecast
    ports:
      - "8080:8080"
    volumes:
      - ./app/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
    command: >
      bash -c "python -c 'import json, os; json.dump({os.environ[\"AIRFLOW_ADMIN_USERNAME\"]: os.environ[\"AIRFLOW_ADMIN_PASSWORD\"]}, open(\"/opt/airflow/simple_auth_manager_passwords.json.generated\", \"w\"))' && exec airflow standalone"
  
volumes:
  db_data:
  pgadmin_data: